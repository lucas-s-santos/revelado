# pnpm 11 lê as configurações daqui, não mais do campo "pnpm" do package.json.
# Quais dependências podem rodar script de build/postinstall.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  core-js: false # só imprime banner de doação
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# O preset `eslint-config-next` carrega plugins que são dependência **dele**
# (@next/eslint-plugin-next, eslint-plugin-react-hooks, @typescript-eslint/*).
# Com o node_modules isolado do pnpm, o ESLint não enxerga nenhum deles a partir
# da raiz e o `pnpm lint` morre antes de analisar uma linha — foi o que manteve
# o portão de qualidade do CI caído.
#
# Hoisting em vez de declarar cópias no package.json: assim a versão continua
# sendo a que o preset escolheu, sem risco de divergir dele numa atualização.
publicHoistPattern:
  - "*eslint*"
  - "@typescript-eslint/*"
